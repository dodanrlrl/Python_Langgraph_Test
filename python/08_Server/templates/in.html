<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뉴스 URL 수집기</title>
  <style>
    :root {
      --primary-color: #03c75a; /* 네이버/뉴스 느낌의 상큼한 그린 */
      --primary-hover: #02b350;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-sub: #666666;
      --border-color: #e1e4e8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 600px;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    h2 {
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    textarea {
      width: 100%;
      padding: 16px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(3, 199, 90, 0.15);
    }

    textarea::placeholder {
      color: #aaa;
    }

    input[type="submit"] {
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    input[type="submit"]:hover {
      background-color: var(--primary-hover);
    }

    input[type="submit"]:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>뉴스 URL 입력</h1>
    <h2>수집할 뉴스 URL을 입력해주세요. (엔터로 구분)</h2>
    <form action="/out">
      <textarea name="urls" rows="12" placeholder="https://news.naver.com/article/...&#10;https://news.naver.com/article/..."></textarea>
      <input type="submit" value="URL전송">
    </form>
  </div>
</body>
</html>
